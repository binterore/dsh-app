name: ci

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Test core and compile
        run: scripts/test.sh
      - name: Build app without bundled runtime
        run: BUNDLE_DSH_RUNTIME=0 BUILD_ARCHS=arm64 ./build.sh
      - name: Verify bundle
        run: codesign --verify --deep --strict --verbose=2 build/DeepSeek.app
